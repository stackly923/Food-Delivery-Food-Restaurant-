<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | STACKLY</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><main class="auth-page signup-page">
  <header class="auth-topbar"><a href="index.html" aria-label="STACKLY home"><img src="assets/images/signup-logo.webp" alt="STACKLY"></a><p>Already have an account? <a href="sign-in.html">Sign In</a></p></header>
  <img class="signup-decor signup-food-frame" src="assets/images/signup-food-frame.webp" alt=""><img class="signup-decor signup-tomato-art" src="assets/images/signup-tomatoes.webp" alt=""><img class="signup-decor signup-cake-art" src="assets/images/signup-cake.webp" alt="">
  <section class="auth-panel"><div class="auth-intro"><h1>Create Account</h1><p>Sign Up to get started with foodie delivery</p></div>
    <form class="auth-form"><div class="signup-name-phone"><label>Full Name<div class="auth-input"><img src="assets/images/signup-name.webp" alt=""><input name="name" placeholder="Enter your full name" required></div></label><label>Phone Number<div class="auth-input"><img src="assets/images/signup-phone.webp" alt=""><input type="tel" name="phone" pattern="[0-9]{10}" placeholder="Enter your phone number" required></div></label></div><label>Email Address<div class="auth-input"><img src="assets/images/signup-email.webp" alt=""><input type="email" name="email" placeholder="Enter your email" required></div></label><label>Password<div class="auth-input"><img src="assets/images/signup-password.webp" alt=""><input type="password" name="password" placeholder="Create a password" minlength="6" required></div></label><label>Confirm Password<div class="auth-input"><img src="assets/images/signup-confirm.webp" alt=""><input type="password" name="confirmPassword" placeholder="Confirm your password" minlength="6" required></div></label>
      <div class="auth-roles" aria-label="Choose account type"><button type="button" class="selected" data-role><img src="assets/images/signup-customer.webp" alt=""><strong>Customer</strong><span>Order food</span><i>✓</i></button><button type="button" data-role><img src="assets/images/signup-restaurant.webp" alt=""><strong>Restaurant</strong><span>Manage restaurant</span></button><button type="button" data-role><img src="assets/images/signup-delivery.webp" alt=""><strong>Delivery partner</strong><span>Deliver orders</span></button></div>
      <div class="auth-options"><label><input type="checkbox" checked required> <span>I agree to the <a href="#terms">Terms of service</a> and <a href="#privacy">Privacy policy</a></span></label></div><button class="auth-submit" type="submit"><img src="assets/images/signup-submit.webp" alt="">Sign Up</button><p class="auth-message" role="status"></p><div class="auth-divider"><span>Or continue with</span></div><button class="auth-social" type="button"><img src="assets/images/signup-google.webp" alt="">Continue With Google</button><button class="auth-social" type="button"><img src="assets/images/signup-apple.webp" alt="">Continue With Apple</button>
    </form>
  </section></main><script src="assets/js/auth.js"></script></body></html>
